name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests fastapi uvicorn

    - name: Run Unit Tests
      run: |
        # Запускаем unit-тесты для каждого сервиса
        pytest catalog_service/tests/unit -v || true
        pytest order_service/tests/unit -v || true
        # ... добавь остальные, если нужно

    - name: Build Docker images
      run: |
        # Проверяем, что Dockerfile-ы вообще собираются
        docker build -t test-catalog ./catalog_service
        docker build -t test-order ./order_service
        docker build -t test-inventory ./inventory_service
        docker build -t test-payment ./payment_service
        docker build -t test-review ./review_service
        docker build -t test-user ./user_service
        echo "Все образы успешно собраны!"